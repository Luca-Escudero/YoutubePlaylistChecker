version: '3.8'

services:
  mysqldb:
    image: mysql:8.0
    container_name: playlist_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: playlist_checker_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./youtube-playlist-checker
      dockerfile: Dockerfile
    container_name: playlist_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PLAYLIST_CHECKER_DB_NAME: playlist_checker_db
      PLAYLIST_CHECKER_DB_USER: root
      PLAYLIST_CHECKER_DB_PASSWORD: root
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-AIzaSyYourYoutubeApiKeyHere}
      PLAYLIST_CHECKER_JWT_SECRET: ${PLAYLIST_CHECKER_JWT_SECRET:-MiClaveSecretaSuperSeguraParaJWTEnYoutubePlaylistChecker12345}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/playlist_checker_db?createDatabaseIfNotExist=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      - mysqldb

  frontend:
    build:
      context: ./playlist-front
      dockerfile: Dockerfile
    container_name: playlist_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mysql_data:
