spring.application.name=youtube-playlist-checker

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties],optional:file:youtube-playlist-checker/.env[.properties]

spring.datasource.url=jdbc:mysql://localhost:3306/${PLAYLIST_CHECKER_DB_NAME}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${PLAYLIST_CHECKER_DB_USER}
spring.datasource.password=${PLAYLIST_CHECKER_DB_PASSWORD}

youtube.api.key=${YOUTUBE_API_KEY}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${PLAYLIST_CHECKER_JWT_SECRET}
