<!doctype html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Playlist Checker | Iniciar Sesión</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <meta name="color-scheme" content="light dark" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/adminlte.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="login-page bg-body-secondary">
    <div class="login-box">
      <div class="login-logo text-center mb-4">
        <a href="/index.html" class="d-inline-flex align-items-center gap-2">
          <i class="bi bi-youtube text-danger fs-1"></i>
          <span><b>Playlist</b>Checker</span>
        </a>
      </div>

      <div class="card shadow-lg border-0">
        <div class="card-body login-card-body p-4">
          <p class="login-box-msg text-center text-secondary mb-4">Inicia sesión para verificar y guardar tus playlists</p>

          <form id="form-login" method="post" onsubmit="event.preventDefault()">
            <div class="input-group mb-3">
              <input type="email" id="email" name="email" class="form-control" placeholder="Correo electrónico" required />
              <div class="input-group-text"><span class="bi bi-envelope"></span></div>
            </div>

            <div class="input-group mb-3">
              <input type="password" id="password" name="password" class="form-control" placeholder="Contraseña" required />
              <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
            </div>

            <div id="error" class="alert alert-danger py-2 text-center" style="display: none"></div>

            <div class="row mt-4">
              <div class="col-12 d-flex justify-content-center">
                <button id="log-button" type="submit" class="btn btn-danger w-100 py-2">
                  <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
              </div>
            </div>
          </form>

          <p class="mb-0 text-center mt-3 text-secondary">
            ¿No tenés cuenta? <a href="register.html" class="text-danger fw-bold text-decoration-none">Crear cuenta</a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/adminlte.js"></script>
    <script type="module" src="/js/login.js"></script>
  </body>
</html>
