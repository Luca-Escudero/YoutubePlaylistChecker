<!doctype html>
<html lang="es">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Playlist Checker | Crear Cuenta</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/adminlte.css" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="register-page bg-body-secondary">
    <div class="register-box">
      <div class="register-logo text-center mb-4">
        <a href="/index.html" class="d-inline-flex align-items-center gap-2">
          <i class="bi bi-youtube text-danger fs-1"></i>
          <span><b>Playlist</b>Checker</span>
        </a>
      </div>

      <div class="card shadow-lg border-0">
        <div class="card-body register-card-body p-4">
          <p class="login-box-msg text-center text-secondary mb-4">Crea tu cuenta para comenzar</p>

          <form id="form-register" onsubmit="event.preventDefault()">
            <div class="input-group mb-3">
              <input type="text" id="nombre" class="form-control" placeholder="Nombre completo" required />
              <div class="input-group-text"><span class="bi bi-person"></span></div>
            </div>

            <div class="input-group mb-3">
              <input type="email" id="email" class="form-control" placeholder="Correo electrónico" required />
              <div class="input-group-text"><span class="bi bi-envelope"></span></div>
            </div>

            <div class="input-group mb-3">
              <input
                type="password"
                id="password"
                class="form-control"
                placeholder="Contraseña (mínimo 6 caracteres)"
                minlength="6"
                required
              />
              <div class="input-group-text"><span class="bi bi-lock-fill"></span></div>
            </div>

            <div id="error" class="alert alert-danger py-2 text-center" style="display: none"></div>
            <div id="success" class="alert alert-success py-2 text-center" style="display: none"></div>

            <div class="row mt-4">
              <div class="col-12 d-flex justify-content-center">
                <button id="register-button" type="submit" class="btn btn-danger w-100 py-2">
                  <i class="bi bi-person-plus me-1"></i> Registrarme
                </button>
              </div>
            </div>
          </form>

          <p class="mb-0 text-center mt-3 text-secondary">
            ¿Ya tenés una cuenta? <a href="login.html" class="text-danger fw-bold text-decoration-none">Iniciar sesión</a>
          </p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/adminlte.js"></script>
    <script type="module" src="/js/register.js"></script>
  </body>
</html>
